name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mealie:
        image: ghcr.io/mealie-recipes/mealie:v3.30.0
        env:
          ALLOW_SIGNUP: "false"
        ports: ["9925:9000"]
    env:
      MADPLAN_TEST_MEALIE_URL: http://localhost:9925
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: madplan/backend/requirements-dev.txt
      - run: pip install -r madplan/backend/requirements-dev.txt
      - name: Lint
        run: ruff check madplan/backend --ignore E501
      - name: Migrations apply to SQLite and match the models
        working-directory: madplan/backend
        env:
          MADPLAN_DATA_DIR: ${{ runner.temp }}/data
        run: |
          mkdir -p "$MADPLAN_DATA_DIR"
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Get a token from the test Mealie
        run: |
          for i in $(seq 1 40); do curl -sf "$MADPLAN_TEST_MEALIE_URL/api/app/about" > /dev/null && break; sleep 3; done
          ACCESS=$(curl -sf -X POST "$MADPLAN_TEST_MEALIE_URL/api/auth/token" -d 'username=changeme@example.com&password=MyPassword' | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          TOKEN=$(curl -sf -X POST "$MADPLAN_TEST_MEALIE_URL/api/users/api-tokens" -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' -d '{"name":"ci"}' | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOKEN"
          echo "MADPLAN_TEST_MEALIE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madplan/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: madplan/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  app:
    name: The app builds as Home Assistant builds it
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: madplan
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.platform == 'linux/amd64' }}
          tags: madplan-app:ci
      - name: It starts, migrates its database and answers
        if: matrix.platform == 'linux/amd64'
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          echo '{"mealie_shopping_list": "MadPlan", "auto_plan_weekday": "thursday"}' > "$RUNNER_TEMP/data/options.json"
          docker run -d --name madplan -p 8099:8099 -v "$RUNNER_TEMP/data:/data" -e MADPLAN_RUN_JOBS=0 madplan-app:ci
          for i in $(seq 1 30); do curl -sf localhost:8099/health && break; sleep 2; done
          curl -sf localhost:8099/health
          curl -sf localhost:8099/ | grep -q "_next"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8099/api/v1/auth/me)" = "401"
          docker logs madplan

  lint-app:
    name: Home Assistant app configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./madplan
