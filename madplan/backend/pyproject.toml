[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
  "B008",  # FastAPI's Depends() and File() are meant to be used as defaults
  "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "S105", "S106", "S107"]
"migrations/env.py" = ["I001"]
